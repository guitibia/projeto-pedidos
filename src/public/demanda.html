<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos das Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
  <style>
    .page-hero-icon {
      width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg, #0d6efd 0%, #6f42c1 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #fff;
      box-shadow: 0 4px 14px rgba(13,110,253,.3);
    }
    .page-hero-title { font-size: 1.3rem; font-weight: 700; margin: 0; }
    .page-hero-sub   { font-size: .8rem; color: var(--text-muted); margin: 0; }
    .card-section {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 14px; padding: 1.25rem; margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="bi bi-box-seam-fill"></i></div>
      <div>
        <div class="system-name">Sistema de Pedidos</div>
        <div class="user-name" id="sidebar-user">Carregando...</div>
      </div>
    </div>
  </div>
  <nav class="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <button class="btn-logout" id="theme-toggle" onclick="toggleTheme()" style="margin-bottom:.5rem"><i class="bi bi-sun"></i> Tema claro</button>
    <button class="btn-logout" id="btn-logout"><i class="bi bi-box-arrow-left"></i> Sair</button>
  </div>
</div>

<div class="main-content">
  <div class="container-fluid py-3" style="max-width:1100px">

    <!-- Hero -->
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="page-hero-icon"><i class="bi bi-people"></i></div>
      <div>
        <div class="page-hero-title">Pedidos das Clientes</div>
        <div class="page-hero-sub">Registre o que cada cliente pediu, agrupe por fornecedor pra comprar e concilie com a NF</div>
      </div>
    </div>

    <div class="card-section">
      <ul class="nav nav-tabs mb-3" id="demandaTabs">
        <li class="nav-item"><button class="nav-link active" data-tab="pedidos">Pedidos</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="entregues">Entregues</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="comprar">Comprar</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="relatorio">Relatório</button></li>
      </ul>

      <section id="tab-pedidos">
        <div class="d-flex gap-2 mb-3 flex-wrap">
          <select id="novo-cliente" class="form-select" style="max-width:320px"></select>
          <input id="novo-obs" class="form-control" placeholder="Observação (opcional)" style="max-width:280px">
          <button id="btn-novo-pedido" class="btn btn-primary">Novo pedido</button>
        </div>
        <div id="lista-pedidos"></div>
      </section>

      <section id="tab-entregues" class="d-none">
        <div class="d-flex gap-2 mb-3 flex-wrap">
          <input id="busca-entregues" class="form-control" placeholder="Buscar por cliente…" style="max-width:320px">
        </div>
        <div id="lista-entregues"></div>
      </section>

      <section id="tab-comprar" class="d-none"><div id="lista-compra"></div></section>
      <section id="tab-relatorio" class="d-none">
        <div id="conteudo-relatorio"></div>
      </section>
    </div>

  </div>
</div>

<footer class="text-center py-3 mt-4">
  <small>&copy; <span id="footer-year"></span> Sistema de Pedidos</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
<script src="/js/auth.js"></script>
<script>
  Auth.requireAuth();
  document.getElementById('footer-year').textContent = new Date().getFullYear();
  Auth.initSidebar();
  document.getElementById('sidebarToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

  function esc(v) {
    return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  const $ = s => document.querySelector(s);
  function show(tab){
    for (const s of ['pedidos','entregues','comprar','relatorio']) $('#tab-'+s).classList.toggle('d-none', s!==tab);
    document.querySelectorAll('#demandaTabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
    if (tab==='entregues') carregarEntregues();
    if (tab==='comprar') carregarCompra();
    if (tab==='relatorio') { carregarRelatorio(); }
  }
  document.querySelectorAll('#demandaTabs .nav-link').forEach(b => b.onclick = () => show(b.dataset.tab));

  let clientes = [];
  async function carregarClientes(){
    const r = await Auth.apiFetch('/api/clients'); clientes = await r.json();
    $('#novo-cliente').innerHTML = '<option value="">Escolha a cliente…</option>' +
      clientes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  }
  let fornecedores = [];
  async function carregarFornecedores(){
    const r = await Auth.apiFetch('/api/demanda/fornecedores'); fornecedores = await r.json();
  }

  function dataBr(v){
    if (!v) return '';
    const d = new Date(v);
    return isNaN(d) ? '' : d.toLocaleDateString('pt-BR');
  }

  function cardPedido(p){
    const pend = Number(p.itens_pendentes) > 0
      ? `<span class="badge bg-warning text-dark ms-1"><i class="bi bi-exclamation-triangle"></i> ${p.itens_pendentes} item(ns) pendente(s)</span>`
      : '';
    const entrega = p.entregue && p.entregue_em
      ? `<div class="text-muted small">Entregue em ${dataBr(p.entregue_em)}</div>`
      : '';
    return `
      <div class="card mb-2"><div class="card-body">
        <div class="d-flex justify-content-between">
          <strong>${esc(p.client_name)}</strong>
          <div><span class="badge bg-secondary">${esc(p.status)} · ${p.qtd_itens} itens</span>${pend}</div>
        </div>
        ${p.observacao ? `<div class="text-muted small">${esc(p.observacao)}</div>` : ''}
        ${entrega}
        <button class="btn btn-sm btn-outline-primary mt-2" onclick="abrirPedido(${p.id})">Abrir</button>
        <button class="btn btn-sm btn-outline-danger mt-2 ms-1" onclick="excluirPedido(${p.id})">Excluir</button>
      </div></div>`;
  }

  async function carregarPedidos(){
    const r = await Auth.apiFetch('/api/demanda'); const pedidos = await r.json();
    const cards = pedidos.map(cardPedido).join('') || '<p class="text-muted">Nenhum pedido ainda.</p>';
    const topo = pedidos.length
      ? `<div class="mb-3"><button id="btn-gerar-todas" class="btn btn-success"><i class="bi bi-cash-coin"></i> Gerar todas as vendas</button>
           <span class="text-muted small ms-2">Gera a venda do que veio em todos os pedidos (baixa o estoque).</span></div>`
      : '';
    $('#lista-pedidos').innerHTML = topo + cards;
    const btnTodas = document.getElementById('btn-gerar-todas');
    if (btnTodas) btnTodas.onclick = gerarTodasVendas;
  }

  async function carregarEntregues(){
    const q = ($('#busca-entregues').value || '').trim();
    const url = '/api/demanda?entregues=1' + (q ? '&q=' + encodeURIComponent(q) : '');
    const r = await Auth.apiFetch(url);
    const pedidos = await r.json();
    const vazio = q
      ? '<p class="text-muted">Nenhum pedido entregue para essa cliente.</p>'
      : '<p class="text-muted">Nenhum pedido entregue nos últimos 90 dias. Busque pelo nome da cliente para ver os mais antigos.</p>';
    $('#lista-entregues').innerHTML = pedidos.map(cardPedido).join('') || vazio;
  }

  let buscaEntreguesTimer = null;
  document.getElementById('busca-entregues').oninput = () => {
    clearTimeout(buscaEntreguesTimer);
    buscaEntreguesTimer = setTimeout(carregarEntregues, 300);
  };

  async function gerarTodasVendas(){
    const conf = await Swal.fire({
      title: 'Gerar todas as vendas?', icon: 'question',
      html: 'Vai gerar a venda do que veio em todos os pedidos e baixar o estoque.<br><br>Forma de pagamento:'
        + '<select id="gv-pgto" class="form-select mt-2"><option value="DINHEIRO">Dinheiro</option><option value="PIX">PIX</option></select>',
      showCancelButton: true, confirmButtonText: 'Gerar', cancelButtonText: 'Cancelar',
      preConfirm: () => document.getElementById('gv-pgto').value
    });
    if (!conf.isConfirmed) return;
    const r = await Auth.apiFetch('/api/demanda/gerar-vendas', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ payment_method: conf.value }) });
    const d = await r.json();
    if (!r.ok) return Swal.fire('Erro', d.error || '', 'error');
    let html = '';
    if (d.geradas.length) html += `<b>${d.geradas.length}</b> venda(s) gerada(s). Total: <b>R$ ${Number(d.total_geral).toFixed(2)}</b><br>`;
    else html += 'Nenhuma venda gerada.<br>';
    if (d.falhas.length) html += '<br><b>Não deu para gerar:</b><br>' + d.falhas.map(f => '• ' + esc(f.cliente) + ' — ' + esc(f.erro)).join('<br>');
    if (d.sem_produto.length) html += '<br><br><b>Itens sem produto ligado (ficaram de fora):</b><br>' + d.sem_produto.map(s => '• ' + esc(s.cliente) + ': ' + esc(s.nome || '')).join('<br>');
    await Swal.fire({ title: 'Resultado', icon: d.geradas.length ? 'success' : 'info', html });
    carregarPedidos();
  }

  async function excluirPedido(id){
    const ok = await Swal.fire({ title:'Excluir este pedido?', text:'Some o pedido e seus itens. Não dá pra desfazer.', icon:'warning', showCancelButton:true, confirmButtonText:'Excluir', cancelButtonText:'Cancelar' });
    if (!ok.isConfirmed) return;
    const r = await Auth.apiFetch('/api/demanda/'+id, { method:'DELETE' });
    const d = await r.json();
    if (!r.ok) return Swal.fire('Não deu', d.error || '', 'error');
    carregarPedidos();
  }

  $('#btn-novo-pedido').onclick = async () => {
    const client_id = $('#novo-cliente').value;
    if (!client_id) return Swal.fire('Escolha a cliente', '', 'warning');
    const r = await Auth.apiFetch('/api/demanda', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ client_id, observacao: $('#novo-obs').value }) });
    if (!r.ok) return Swal.fire('Erro', (await r.json()).error || '', 'error');
    const novo = await r.json();
    $('#novo-obs').value = '';
    await carregarPedidos();
    abrirPedido(novo.id);
  };

  async function abrirPedido(id){
    const r = await Auth.apiFetch('/api/demanda/'+id); const p = await r.json();
    const fornOpts = fornecedores.map(f => `<option value="${esc(f.cnpj)}" data-nome="${esc(f.nome)}">${esc(f.nome)}</option>`).join('');
    const nVeio = p.itens.filter(i => i.status==='veio').length;
    const nParcial = p.itens.filter(i => i.status==='parcial').length;
    const nFaltou = p.itens.filter(i => i.status!=='veio' && i.status!=='parcial').length;
    const linhas = p.itens.map(i => {
      const badge = i.status==='veio' ? '<span class="badge bg-success">veio</span>'
        : (i.status==='parcial' ? '<span class="badge bg-warning text-dark">parcial</span>' : '<span class="badge bg-secondary">faltou</span>');
      return `
      <tr>
        <td>${esc(i.nome || i.codigo || '')}</td>
        <td class="text-center">${i.qtd_pedida}</td>
        <td>
          <button class="btn btn-sm btn-outline-success" title="Chegou tudo" onclick="ajustarRecebido(${i.id}, ${i.qtd_pedida}, ${id})">✓ Chegou</button>
          <button class="btn btn-sm btn-outline-secondary" title="Não veio" onclick="ajustarRecebido(${i.id}, 0, ${id})">✗ Não veio</button>
          <input type="number" min="0" max="${i.qtd_pedida}" value="${i.qtd_recebida}" style="width:56px" class="form-control form-control-sm d-inline-block ms-1" title="quantidade recebida (parcial)"
                 onchange="ajustarRecebido(${i.id}, this.value, ${id})">
          ${badge}
        </td>
        <td><button class="btn btn-sm btn-outline-danger" title="Remover item" onclick="removerItem(${i.id}, ${id})">×</button></td>
      </tr>`;
    }).join('');
    Swal.fire({
      title: esc(p.client_name), width: 800,
      html: `
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="small">✅ Vieram: <b>${nVeio}</b> &nbsp;·&nbsp; 🟡 Parcial: <b>${nParcial}</b> &nbsp;·&nbsp; ❌ Faltaram: <b>${nFaltou}</b></div>
          <button id="btn-conferir-nf" class="btn btn-sm btn-success">Puxar da NF</button>
        </div>
        <table class="table table-sm align-middle"><thead><tr><th>Produto</th><th class="text-center">Pediu</th><th>Conferência</th><th></th></tr></thead>
        <tbody>${linhas || '<tr><td colspan=4 class="text-muted">Sem itens</td></tr>'}</tbody></table>
        <hr>
        <div class="row g-2">
          <div class="col"><select id="it-forn" class="form-select form-select-sm"><option value="">Fornecedor…</option>${fornOpts}</select></div>
          <div class="col"><input id="it-cod" class="form-control form-control-sm" placeholder="Código"></div>
          <div class="col"><input id="it-nome" class="form-control form-control-sm" placeholder="Produto"></div>
          <div class="col"><input id="it-qtd" type="number" min="1" value="1" class="form-control form-control-sm" placeholder="Qtd"></div>
          <div class="col"><input id="it-preco" type="number" min="0" step="0.01" class="form-control form-control-sm" placeholder="Preço"></div>
          <div class="col-auto"><button id="it-add" class="btn btn-sm btn-primary">+</button></div>
        </div>
        <div class="d-flex gap-2 mt-2">
          <button id="btn-gerar-venda" class="btn btn-sm btn-success">Gerar venda do que veio</button>
          <button id="btn-whats" class="btn btn-sm btn-outline-success">Avisar no WhatsApp</button>
          <button id="btn-imprimir-sep" class="btn btn-sm btn-outline-primary" onclick="imprimirSeparacao(${id})"><i class="bi bi-printer"></i> Imprimir separação</button>
        </div>`,
      showConfirmButton: false, showCloseButton: true,
      didOpen: () => {
        const btnConf = document.getElementById('btn-conferir-nf');
        if (btnConf) btnConf.onclick = () => conferirPedido(id);
        document.getElementById('it-add').onclick = async () => {
          const sel = document.getElementById('it-forn');
          const body = {
            fornecedor_cnpj: sel.value,
            fornecedor_nome: sel.selectedOptions[0] ? sel.selectedOptions[0].dataset.nome : '',
            codigo: document.getElementById('it-cod').value,
            nome: document.getElementById('it-nome').value,
            qtd_pedida: document.getElementById('it-qtd').value,
            preco_venda: document.getElementById('it-preco').value,
          };
          const rr = await Auth.apiFetch('/api/demanda/'+id+'/itens', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
          if (!rr.ok) return Swal.fire('Erro', (await rr.json()).error || '', 'error');
          abrirPedido(id);
        };
        document.getElementById('btn-gerar-venda').onclick = async () => {
          const semProd = p.itens.filter(i => Number(i.qtd_recebida) > 0 && !i.product_id);
          const rr = await Auth.apiFetch('/api/demanda/'+id+'/rascunho-venda');
          const rasc = await rr.json();
          if (!rasc.itens || !rasc.itens.length) {
            const dica = semProd.length
              ? 'Há itens marcados como recebidos, mas sem produto ligado. Use "Puxar da NF" para ligá-los ao estoque.'
              : 'Não há itens com produto e quantidade recebida para vender.';
            return Swal.fire('Nada a vender ainda', dica, 'info');
          }
          if (semProd.length) {
            const lista = semProd.map(i => '• ' + esc(i.nome || i.codigo || '')).join('<br>');
            const go = await Swal.fire({ title: 'Alguns itens ficam de fora', icon: 'warning',
              html: 'Estes itens vieram mas não têm produto ligado (não entram na venda):<br><br>' + lista + '<br><br>Use "Puxar da NF" para ligá-los. Gerar a venda com o resto?',
              showCancelButton: true, confirmButtonText: 'Gerar assim mesmo', cancelButtonText: 'Voltar' });
            if (!go.isConfirmed) return;
          }
          sessionStorage.setItem('rascunhoVenda', JSON.stringify(rasc));
          window.location.href = 'pedidos.html';
        };
        document.getElementById('btn-whats').onclick = () => {
          const veio = p.itens.filter(i => i.status==='veio' || i.status==='parcial').map(i => '• '+ (i.nome||i.codigo) + (i.status==='parcial' ? ' (parcial)' : '')).join('\n');
          const faltou = p.itens.filter(i => i.status!=='veio' && Number(i.qtd_recebida)===0).map(i => '• '+(i.nome||i.codigo)).join('\n');
          let msg = 'Oi '+p.client_name+'! ';
          if (veio) msg += 'Chegou:\n'+veio+'\n';
          if (faltou) msg += '\nInfelizmente não veio dessa vez:\n'+faltou;
          const tel = (p.phone||'').replace(/\D/g,'');
          window.open('https://wa.me/'+ (tel ? '55'+tel : '') +'?text='+encodeURIComponent(msg), '_blank');
        };
      }
    });
  }

  async function imprimirSeparacao(pedidoId){
    const r = await Auth.apiFetch('/api/demanda/'+pedidoId); const p = await r.json();
    const vieram   = p.itens.filter(i => Number(i.qtd_recebida) > 0);
    const faltaram = p.itens.filter(i => Number(i.qtd_recebida) < Number(i.qtd_pedida));
    const linhasVeio = vieram.map(i => `<tr><td>${esc(i.nome || i.codigo || '')}</td><td style="text-align:center">${i.qtd_recebida}</td></tr>`).join('')
      || '<tr><td colspan="2">Nenhum item recebido ainda.</td></tr>';
    const linhasFalta = faltaram.map(i => `<li>${esc(i.nome || i.codigo || '')} — faltou ${Number(i.qtd_pedida) - Number(i.qtd_recebida)}</li>`).join('');
    const w = window.open('', '_blank', 'width=720,height=860');
    if (!w) { Swal.fire('Bloqueado', 'O navegador bloqueou a janela de impressão. Permita pop-ups pra este site.', 'warning'); return; }
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Separação — ${esc(p.client_name)}</title>
      <style>
        body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:24px}
        h1{font-size:20px;margin:0 0 2px} .sub{color:#555;font-size:13px;margin-bottom:16px}
        h2{font-size:15px;margin:18px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
        table{width:100%;border-collapse:collapse} td,th{padding:6px 8px;border-bottom:1px solid #eee;font-size:14px;text-align:left}
        th:last-child,td:last-child{text-align:center;width:70px}
        ul{margin:.3rem 0;padding-left:20px} li{font-size:13px;color:#333}
        @media print{body{margin:0}}
      </style></head><body>
      <h1>Separação — ${esc(p.client_name)}</h1>
      <div class="sub">Data: ${new Date().toLocaleDateString('pt-BR')}</div>
      <h2>Separar / entregar</h2>
      <table><thead><tr><th>Produto</th><th>Qtd</th></tr></thead><tbody>${linhasVeio}</tbody></table>
      ${linhasFalta ? `<h2>Faltou (avisar a cliente)</h2><ul>${linhasFalta}</ul>` : ''}
      </body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); }, 300);
  }
  async function conferirPedido(pedidoId){
    const r = await Auth.apiFetch('/api/nf'); const nfs = await r.json();
    const nfOpts = nfs.map(n => `<option value="${n.id}">#${n.id} — ${esc(n.emitente_nome||'')} (nota ${esc(String(n.numero||''))})</option>`).join('');
    Swal.fire({
      title: 'Puxar da NF', width: 820, showConfirmButton: false, showCloseButton: true,
      html: `
        <select id="cp-nf" class="form-select form-select-sm mb-2"><option value="">Escolha a NF importada…</option>${nfOpts}</select>
        <div id="cp-conteudo" class="text-muted small">Escolha a NF que você importou.</div>`,
      didOpen: () => { document.getElementById('cp-nf').onchange = (e) => renderConferenciaPedido(pedidoId, e.target.value); },
      willClose: () => { abrirPedido(pedidoId); }   // reabre o pedido com os status atualizados
    });
  }

  // --- sugestão de casamento por nome (best-effort): compara o nome do item do pedido com a descrição da NF ---
  function _normNome(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
  function _tokensNome(s){ return _normNome(s).split(' ').filter(t => t.length >= 3); }
  function _scoreNome(nomePedido, descNf){
    const a = _tokensNome(nomePedido), b = _tokensNome(descNf);
    if (!a.length || !b.length) return 0;
    let n = 0;
    for (const ta of a) { if (b.some(tb => ta === tb || tb.startsWith(ta) || ta.startsWith(tb))) n++; }
    return n;
  }

  async function renderConferenciaPedido(pedidoId, nfId){
    const cont = document.getElementById('cp-conteudo');
    if (!nfId) { cont.innerHTML = 'Escolha uma NF pra conferir.'; return; }
    cont.innerHTML = 'Conferindo pela NF…';
    const [pr, cr] = await Promise.all([ Auth.apiFetch('/api/demanda/'+pedidoId), Auth.apiFetch('/api/demanda/nf/'+nfId+'/conferir') ]);
    const p = await pr.json(); const conf = await cr.json();
    const nfItens = conf.itens || [];
    let marcados = 0, semMatch = 0;
    for (const i of p.itens) {
      if (i.status === 'veio') continue;
      // acha o item da NF de nome mais parecido
      let best = null, bestScore = 0;
      for (const it of nfItens) { const sc = _scoreNome(i.nome, it.descricao || it.produto_nome || ''); if (sc > bestScore) { bestScore = sc; best = it; } }
      if (best && bestScore >= 1) {
        const nfQ = Math.floor(Number(best.quantidade) || 0);
        const qtd = nfQ > 0 ? Math.min(Number(i.qtd_pedida) || 0, nfQ) : (Number(i.qtd_pedida) || 0);
        const payload = { qtd_recebida: qtd };
        if (best.product_id) payload.product_id = best.product_id;
        const rr = await Auth.apiFetch('/api/demanda/itens/'+i.id+'/alocacao', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        if (rr.ok) marcados++;
      } else { semMatch++; }
    }
    cont.innerHTML = `Pré-marquei <b>${marcados}</b> item(ns) que a NF trouxe (por semelhança de nome).`
      + (semMatch ? ` <b>${semMatch}</b> não deu pra adivinhar — marque na mão no pedido.` : '')
      + `<div class="mt-2"><button class="btn btn-sm btn-primary" onclick="Swal.close()">Voltar ao pedido e conferir</button></div>`;
  }

  async function ajustarRecebido(itemId, val, pedidoId){
    const rr = await Auth.apiFetch('/api/demanda/itens/'+itemId+'/alocacao', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ qtd_recebida: val }) });
    if (!rr.ok) { Swal.fire('Erro', (await rr.json()).error || '', 'error'); }
    abrirPedido(pedidoId);
  }
  async function removerItem(itemId, pedidoId){
    const rr = await Auth.apiFetch('/api/demanda/itens/'+itemId, { method:'DELETE' });
    if (rr.ok) abrirPedido(pedidoId);
  }

  async function carregarCompra(){
    const r = await Auth.apiFetch('/api/demanda/compra'); const forns = await r.json();
    $('#lista-compra').innerHTML = forns.map(f => `
      <div class="card mb-3"><div class="card-body">
        <h5>${esc(f.fornecedor_nome||'(sem fornecedor)')}</h5>
        <table class="table table-sm"><thead><tr><th>Cód.</th><th>Produto</th><th>Qtd</th><th>Clientes</th></tr></thead>
        <tbody>${f.itens.map(i => `<tr><td>${esc(i.codigo)}</td><td>${esc(i.nome||'')}</td><td>${i.qtd_total}</td>
          <td>${i.clientes.map(c => esc(c.client_name)+' ('+c.qtd+')').join(', ')}</td></tr>`).join('')}</tbody></table>
      </div></div>`).join('') || '<p class="text-muted">Nada pendente para comprar.</p>';
  }

  async function carregarRelatorio(){
    const r = await Auth.apiFetch('/api/demanda/relatorio'); const d = await r.json();
    $('#conteudo-relatorio').innerHTML = `
      <h5>Por cliente</h5>
      <table class="table table-sm"><thead><tr><th>Cliente</th><th>Veio</th><th>Parcial</th><th>Faltou</th><th>Total</th></tr></thead>
      <tbody>${d.porCliente.map(c => `<tr><td>${esc(c.client_name)}</td><td>${c.itens_veio}</td><td>${c.itens_parcial}</td><td>${c.itens_faltou}</td><td>${c.itens_total}</td></tr>`).join('')}</tbody></table>
      <h5 class="mt-4">Por fornecedor</h5>
      <table class="table table-sm"><thead><tr><th>Fornecedor</th><th>Pedido</th><th>Recebido</th><th>Faltou</th></tr></thead>
      <tbody>${d.porFornecedor.map(f => `<tr><td>${esc(f.fornecedor_nome)}</td><td>${f.qtd_pedida}</td><td>${f.qtd_recebida}</td><td>${f.qtd_faltou}</td></tr>`).join('')}</tbody></table>`;
  }

  (async function init(){ await carregarClientes(); await carregarFornecedores(); await carregarPedidos(); })();
</script>
</body>
</html>
